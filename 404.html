
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Power Boost Official</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080d18;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 450px;
      width: 100%;
      padding: 40px 25px;
      background: #111a2b;
      border: 1px solid #263650;
      border-radius: 22px;
    }

    .number {
      font-size: 90px;
      font-weight: 800;
      color: #6d8cff;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #aab6ca;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 10px;
      background: #5478ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #3d62e8;
    }

    .brand {
      margin-top: 25px;
      color: #8291aa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="number">404</div>
    <h1>Page Not Found</h1>
    <p>
      Sorry! The page you are looking for
      does not exist or may have been moved.
    </p>
    <a href="index.html">Back to Home</a>

</html>
